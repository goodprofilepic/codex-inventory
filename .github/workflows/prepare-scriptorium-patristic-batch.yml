name: Prepare Scriptorium 200-Work Reading Room Batch

on:
  push:
    branches:
      - main
      - codex/patristic-first-batch
      - codex/strict-inventory-200-2026-11-22
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-acquisition:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out acquisition scripts and latest inventory
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install text extraction tools and parser dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y antiword
          python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Download public patristic source vault
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://codeload.github.com/HistoricalChristianFaith/Writings-Database/zip/refs/heads/master" \
            -o /tmp/writings-database.zip
          mkdir -p /tmp/writings-database
          unzip -q /tmp/writings-database.zip -d /tmp/writings-database
          SOURCE_DIR="$(find /tmp/writings-database -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$SOURCE_DIR"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
      - name: Fetch the latest Reading Room inventory from main
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git show FETCH_HEAD:reading-room-inventory-latest-11-22-26.csv > /tmp/reading-room-inventory-latest-11-22-26.csv
          test -s /tmp/reading-room-inventory-latest-11-22-26.csv
      - name: Build inventory-screened 200-work batch
        run: |
          python scripts/prepare_scriptorium_batch_200.py \
            --source-dir "$SOURCE_DIR" \
            --inventory-csv /tmp/reading-room-inventory-latest-11-22-26.csv \
            --output-dir build/scriptorium-reading-room-batch-200
      - name: Independently audit manifest against the latest inventory
        run: |
          python scripts/verify_scriptorium_batch.py \
            --inventory-csv /tmp/reading-room-inventory-latest-11-22-26.csv \
            --manifest-csv build/scriptorium-reading-room-batch-200/manifest.csv \
            --report build/scriptorium-reading-room-batch-200/INDEPENDENT-AUDIT.md
      - name: Upload the ZIP, manifest, README and independent audit
        uses: actions/upload-artifact@v4
        with:
          name: scriptorium-reading-room-batch-200
          path: build/scriptorium-reading-room-batch-200/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
